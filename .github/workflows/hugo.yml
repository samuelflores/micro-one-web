name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.161.1"
      TZ: Europe/Stockholm
      HUGO_ENVIRONMENT: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Hugo
        run: |
          curl --fail --silent --show-error --location "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" --output "${RUNNER_TEMP}/hugo.tar.gz"
          mkdir -p "${RUNNER_TEMP}/hugo-bin"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo-bin"
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"
      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo-cache
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --panicOnWarning --baseURL "${PAGES_BASE_URL%/}/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
